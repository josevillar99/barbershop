databases:
  - name: peluqueria-db
    plan: free
    databaseName: peluqueria
    user: peluqueria

services:
  - type: web
    name: peluqueria-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: TZ
        value: Europe/Madrid
      - key: DB_HOST
        fromDatabase:
          name: peluqueria-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: peluqueria-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: peluqueria-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: peluqueria-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: peluqueria-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      # Rellenar tras el primer despliegue con la URL real del frontend
      # (ej. https://peluqueria-frontend.onrender.com), y con FRONTEND_URL igual.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: peluqueria-frontend
    env: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Rellenar tras desplegar el backend con su URL real
      # (ej. https://peluqueria-backend.onrender.com/api).
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
