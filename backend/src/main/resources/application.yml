server:
  port: 8080

spring:
  application:
    name: peluqueria-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  main:
    # Crea los beans bajo demanda en vez de todos al arrancar: recorta bastante el
    # tiempo de arranque en entornos con poca CPU (ej. plan gratuito de Render).
    lazy-initialization: true

  datasource:
    # DB_URL manda si se indica (uso local/Docker Compose); si no, se compone a partir
    # de host/puerto/nombre sueltos (asi lo entrega Render para su Postgres gestionado).
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:peluqueria}}
    username: ${DB_USER:peluqueria}
    password: ${DB_PASSWORD:peluqueria}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:no-reply@peluqueria.local}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-change-this-secret-please}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  admin:
    email: ${ADMIN_EMAIL:admin@peluqueria.local}
  superadmin:
    email: ${SUPERADMIN_EMAIL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  auth:
    signup-token-ttl-minutes: 30
    signup-resend-cooldown-seconds: 60
  booking:
    horizon-days: ${BOOKING_HORIZON_DAYS:30}
    slot-step-minutes: ${BOOKING_SLOT_STEP_MINUTES:15}
    tolerable-gap-minutes: ${BOOKING_TOLERABLE_GAP_MINUTES:15}
  alerts:
    email: ${ERROR_ALERT_EMAIL:}

logging:
  level:
    com.peluqueria: INFO
