server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Resolver el host "backend" en tiempo de peticion (via una variable), no al
        # arrancar nginx: asi, en despliegues donde no existe ese host de Docker Compose
        # (ej. Render, donde el frontend llama al backend por su URL completa y nunca
        # pasa por aqui), nginx arranca igualmente en vez de fallar por no resolverlo.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8080;
        # $request_uri (no un sufijo fijo): con variable en proxy_pass, nginx no hace su
        # sustitucion automatica de prefijo, asi que hay que reenviar la ruta original a mano.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
